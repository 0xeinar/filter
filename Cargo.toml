[package]
name = "filter"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A surgical parametric EQ plugin"

[workspace]
resolver = "2"
members = [".", "xtask"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_iced = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["opengl_canvas"] }
atomic_float = "0.1"
serde = { version = "1", features = ["derive"] }
rustfft = "6.2"

[[bench]]
name = "hotpath_bench"
harness = false

[dev-dependencies]
approx = "0.5"
proptest = "1.4"
serde_json = "1"
# Same rev nih_plug_iced pulls in, so `Geometry::into_primitive()` yields the
# exact same `Primitive` type in tests (see src/ui/graph.rs).
iced_graphics = { git = "https://github.com/iced-rs/iced.git", rev = "a53fa91e0ddf374bbeb66d5e831b79127ed47a9d", default-features = false }

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"