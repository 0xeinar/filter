[package]
name = "filter"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A surgical parametric EQ plugin"

[workspace]
resolver = "2"
members = [
    ".",
    "xtask",
]

[lib]
crate-type = ["cdylib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", features = ["assert_process_allocs"] }
nih_plug_iced = { git = "https://github.com/robbert-vdh/nih-plug.git" }
atomic_float = "0.1"

[dev-dependencies]
approx = "0.5"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
