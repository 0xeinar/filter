[package]
name = "filter"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "A surgical parametric EQ plugin"

[workspace]
resolver = "2"
members = [
    ".",
    "xtask",
]

[lib]
crate-type = ["cdylib"]

[dependencies]
nih_plug = { path = "../nih-plug-ref", features = ["assert_process_allocs"] }
nih_plug_iced = { path = "../nih-plug-ref/nih_plug_iced" }
atomic_float = "0.1"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
