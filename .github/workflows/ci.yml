name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y libasound2-dev libgl-dev libxcb1-dev \
            libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev \
            libwayland-dev libx11-dev pkg-config \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-icccm4-dev libx11-xcb-dev libxcb-dri2-0-dev \
            libxcb-util-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Build plugin
        run: cargo run -p xtask -- bundle filter --release
